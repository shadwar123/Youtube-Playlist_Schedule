services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXTAUTH_URL=http://localhost:3000
      - REMOVED=
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - REMOVED=
      - REMOVED=
      - REMOVED=
      - REMOVED=
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - REMOVED=postgresql://postgres:postgres@db:5432/youtube_scheduler
    volumes:
      - ./server:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      - db

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - REMOVED=postgres
      - REMOVED=postgres
      - REMOVED=youtube_scheduler
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: 
